<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks — Admit Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root { --cream: #F2EDE1; --forest: #1B3A2E; --moss: #4A7C59; --ink: #0F0F0F; --dim: #6B6459; }
body { background: var(--forest); color: var(--cream); font-family: 'Inter Tight', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; }
.logo { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 80px; font-variation-settings: "opsz" 144; }
.logo span { color: var(--moss); }
h1 { font-family: 'Fraunces', serif; font-size: clamp(48px, 8vw, 96px); font-weight: 400; line-height: 0.93; letter-spacing: -0.04em; font-variation-settings: "opsz" 144, "SOFT" 40; margin-bottom: 24px; }
h1 em { font-style: italic; color: rgba(242,237,225,0.45); }
p { font-size: 18px; line-height: 1.65; color: rgba(242,237,225,0.65); max-width: 420px; margin-bottom: 48px; }
a { display: inline-block; background: var(--cream); color: var(--forest); padding: 16px 36px; border-radius: 999px; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; transition: background 0.2s; }
a:hover { background: #EBE5D3; }
</style>
</head>
<body>
  <div class="logo">Admit Team<span>.</span></div>
  <h1>You're on<br>our <em>radar.</em></h1>
  <p>We got your inquiry and will reach out within 24 hours to schedule your free intro call.</p>
  <a href="/">← Back to admitteam.us</a>
</body>
</html>
